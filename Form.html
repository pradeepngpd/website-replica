<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Form</title>
  </head>
  <body>
    <h1>Payment Form</h1>
    <p>* indicates required fields</p>
    
    <form action="">
      
        <p>Name: * <input type="text" name="name" id="name" required /></p>
      
      <p>
        Gender: *<select name="gender" required>
          <option value="">--Select Gender--</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </p>
      
      <p>Email: * <input type="email" name="email" id="email" required /></p>
      
      <p>
        Pincode: * <input type="number" name="pincode" id="pincode" required />
      </p>
      
      <p>Address: <textarea name="address" id="address" rows="4" cols="50"></textarea></p>

      <h1>Payment Details</h1>

      <fieldset>
        <legend>Card Type: *</legend>
        <p>
          Visa<input
            type="radio"
            id="visa"
            name="card_type"
            value="visa"
            required
          />Master<input
            type="radio"
            id="master"
            name="card_type"
            value="master"
            required
          />Rupay<input type="radio" id="rupay" name="card_type" value="rupay" required />
        </p>
      </fieldset>

      <p>
        Card Number: *
        <input type="number" name="card_number" id="card_number" required />
      </p>

      <p>
        Card Holder Name: *
        <input
          type="text"
          name="card_holder_name"
          id="card_holder_name"
          required
        />
      </p>

      <p>
        Expiry Date: *
        <input type="date" name="expiry_date" id="expiry_date" required />
      </p>

      <p>CVV: * <input type="password" name="cvv" id="cvv" required /></p>

      <br />

      <button type="submit">Submit</button>

    </form>

  </body>
  
</html>
